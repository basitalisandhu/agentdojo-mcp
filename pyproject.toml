[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentdojo-mcp"
version = "0.1.0"
description = "Run AgentDojo against MCP servers: map a task suite's tools onto a real MCP server, run the benchmark's user tasks and injection tasks against the server's tool surface, and report utility and attack success per task with every call logged."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Basit Ali" }]
keywords = [
  "agentdojo",
  "mcp",
  "model-context-protocol",
  "prompt-injection",
  "benchmark",
  "agent-security",
  "llm-security",
  "evaluation",
  "ai-agents",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dojo = ["agentdojo>=0.1.35"]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
agentdojo-mcp = "agentdojo_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/basitalisandhu/agentdojo-mcp"
Repository = "https://github.com/basitalisandhu/agentdojo-mcp"
Issues = "https://github.com/basitalisandhu/agentdojo-mcp/issues"
Changelog = "https://github.com/basitalisandhu/agentdojo-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/basitalisandhu/agentdojo-mcp/blob/main/docs/mapping.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdojo_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agentdojo_mcp/**",
  "examples/**",
  "docs/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "dojo: needs AgentDojo installed (pip install -e \".[dojo]\"); skipped otherwise",
]
